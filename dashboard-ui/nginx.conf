server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vite build assets (JS/CSS) — served from /usr/share/nginx/html/assets/
    location /assets/ {
        try_files $uri =404;
    }

    # CCTV MP4s only — proxied to API static mount
    location /assets/cctv/ {
        proxy_pass http://api:8000/assets/cctv/;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (Docker: dashboard → api service)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
